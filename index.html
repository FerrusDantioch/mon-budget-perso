<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Budget Perso</title>

    <meta name="apple-mobile-web-app-title" content="Budget">

    <style>
        /* --- VARIABLES DE THÈME --- */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --card-bg: #ffffff;
            --header-color: #2c3e50;
            --subtitle-color: #7f8c8d;
            --border-color: #ecf0f1;
            --input-border: #bdc3c7;
            --primary-color: #3498db;
            --secondary-color: #95a5a6;
            --success-color: #27ae60;
            --warning-color: #e67e22;
            --danger-color: #e74c3c;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Thème Sombre */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2d2d2d;
            --header-color: #ecf0f1;
            --subtitle-color: #b0b0b0;
            --border-color: #404040;
            --input-border: #555555;
            --shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        /* --- RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 15px;
            transition: background-color 0.3s, color 0.3s;
            padding-bottom: 80px; /* Espace pour le footer si nécessaire */
        }

        .container { max-width: 600px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: var(--header-color); font-size: 1.8rem; margin-bottom: 5px; }
        .subtitle { color: var(--subtitle-color); font-size: 0.9rem; }

        /* --- CARTES --- */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--header-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* --- FORMULAIRES --- */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        
        input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 1rem;
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
        }
        input:focus, select:focus { border-color: var(--primary-color); }

        /* --- BOUTONS --- */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-align: center;
            margin-bottom: 10px;
            color: white;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary-color); }
        .btn-secondary { background-color: var(--secondary-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-warning { background-color: var(--warning-color); }

        /* --- ONGLETS --- */
        .tabs {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--subtitle-color);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- GRAPHIQUE & STATUS --- */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        #expenseChart { max-width: 100%; }
        
        .status-info {
            margin-top: 10px;
            font-size: 0.95rem;
            background: var(--border-color);
            padding: 10px;
            border-radius: 6px;
            color: var(--text-color);
        }
        .alert {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--danger-color);
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        /* --- LISTE DÉPENSES --- */
        .expense-list { list-style: none; }
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .expense-item:last-child { border-bottom: none; }
        .expense-info { display: flex; flex-direction: column; }
        .expense-cat { font-size: 0.8rem; color: var(--subtitle-color); }
        .expense-amount { font-weight: bold; color: var(--danger-color); }
        .btn-delete {
            background: none; border: none; color: var(--danger-color);
            cursor: pointer; font-size: 1.5rem; margin-left: 10px; padding: 0 5px;
        }

        /* --- SAUVEGARDE & MESSAGES --- */
        .backup-section { border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.02); }
        .backup-desc { font-size: 0.85rem; color: var(--subtitle-color); margin-bottom: 15px; text-align: center; }
        .backup-buttons { display: flex; flex-direction: column; gap: 10px; }
        .message-box {
            margin-top: 10px; padding: 10px; border-radius: 6px;
            text-align: center; font-size: 0.9rem; display: none;
        }
        .message-box.success { background-color: rgba(39, 174, 96, 0.2); color: var(--success-color); display: block; }
